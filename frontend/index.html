<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EEEDF2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#110C22" media="(prefers-color-scheme: dark)" />
    <title>Racik — Contoh Brand</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Terapkan tema sebelum React dimuat agar tidak berkedip
      try {
        var saved = localStorage.getItem('autoreels_dark_mode');
        var dark = saved === null ? window.matchMedia('(prefers-color-scheme: dark)').matches : saved === 'true';
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
