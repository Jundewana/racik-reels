# Daftar pilar konten, audiens, struktur naratif default, dan hashtag dasar.

rental:
  label: "A. Rental Motor"
  priority: 1
  audience: ["wisatawan ke Garut", "warga lokal", "mahasiswa/perantau"]
  goal: "booking via WhatsApp/DM"
